<script src="https://unpkg.com/turndown-plugin-gfm/dist/turndown-plugin-gfm.js"></script>
<script>
  (function() {
    try {
      var isEl = !!(window.electronAPI?.isElectron || /Electron/i.test(navigator.userAgent));
      if (isEl) {
        var p = window.electronAPI?.platform || ((/Mac/i.test(navigator.userAgent) && !/iPhone|iPad/i.test(navigator.userAgent)) ? 'darwin' : (/Win/i.test(navigator.userAgent) || /Win/i.test(navigator.platform) ? 'win32' : 'linux'));
        document.documentElement.classList.add('is-electron', p === 'darwin' ? 'is-electron-mac' : (p === 'win32' ? 'is-electron-win' : 'is-electron-linux'));
      }
    } catch (e) {}
  })();
</script>
<script>
  try {
    if (typeof marked !== 'undefined' && typeof marked.setOptions === 'function') {
      marked.setOptions({
        gfm: true,
        breaks: false,
        headerIds: false,
        mangle: false,
        smartLists: true,
        sanitize: false
      });
    }
  } catch (e) { console.warn('Could not set marked options', e); }

  const turndownService = new TurndownService({
    codeBlockStyle: 'fenced',
    bulletListMarker: '-'
  });
  try {
    if (typeof turndownPluginGfm !== 'undefined') {
      turndownService.use(turndownPluginGfm.gfm);
    }
  } catch (e) { console.warn('Could not load turndown GFM plugin', e); }
  try { turndownService.keep(['mark']); } catch (e) { console.warn('Could not keep mark tags', e); }
  try {
    turndownService.addRule('mathInline', {
      filter: function (node) {
        return node.nodeName === 'SPAN' && (node.classList.contains('note-math') || node.hasAttribute('data-latex'));
      },
      replacement: function (content, node) {
        const latex = node.getAttribute('data-latex') || content || '';
        return `$${latex}$`;
      }
    });
    turndownService.addRule('mathBlock', {
      filter: function (node) {
        return (node.nodeName === 'DIV' || node.nodeName === 'P' || node.nodeName === 'SPAN') && (node.classList.contains('note-math-block') || (node.classList.contains('note-math') && node.getAttribute('data-math-mode') === 'block'));
      },
      replacement: function (content, node) {
        const latex = node.getAttribute('data-latex') || content || '';
        return `\n\n$$\n${latex}\n$$\n\n`;
      }
    });
  } catch (e) { console.warn('Could not add turndown math rules', e); }

  function toggleFloatingChat() {
    if (typeof window._realToggleFloatingChat === 'function') {
      return window._realToggleFloatingChat.apply(this, arguments);
    }
  }
  function closeNoteOverlay() {
    if (typeof window._realCloseNoteOverlay === 'function') {
      return window._realCloseNoteOverlay.apply(this, arguments);
    }
  }
</script>
