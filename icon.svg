<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Accent Gradient for Notebook and 'S' -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Outer Glow Filter -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Premium Squircle Canvas with gradient border -->
  <rect x="20" y="20" width="472" height="472" rx="128" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Inner content group -->
  <g transform="translate(106, 96)" filter="url(#outerGlow)">
    <!-- Back Page (Shadowy layered sheet) -->
    <rect x="40" y="20" width="220" height="280" rx="24" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.4" transform="rotate(-6 150 160)" />

    <!-- Front Page Base (Sleek dark panel) -->
    <rect x="40" y="20" width="220" height="280" rx="24" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="12" />

    <!-- Spiral Binder Loops (Representing Secretary/Notebook) -->
    <path d="M 22 70 C 22 62, 50 62, 50 70 C 50 78, 22 78, 22 70 Z" fill="url(#accentGrad)" opacity="0.9" />
    <path d="M 22 130 C 22 122, 50 122, 50 130 C 50 138, 22 138, 22 130 Z" fill="url(#accentGrad)" opacity="0.9" />
    <path d="M 22 190 C 22 182, 50 182, 50 190 C 50 198, 22 198, 22 190 Z" fill="url(#accentGrad)" opacity="0.9" />
    <path d="M 22 250 C 22 242, 50 242, 50 250 C 50 258, 22 258, 22 250 Z" fill="url(#accentGrad)" opacity="0.9" />

    <!-- Glowing Monogram 'S' Path -->
    <path d="M 195 80 C 135 80, 105 90, 105 125 C 105 160, 195 160, 195 195 C 195 220, 165 240, 105 240" 
          fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sleek Pen Clip detailing on the right -->
    <path d="M 270 50 L 270 120 C 270 125, 260 130, 255 130" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
