<!-- ── Omnibar Modal ── -->
<div class="omnibar-overlay" id="omnibar-overlay">
  <div class="omnibar-container" id="omnibar-container" role="dialog" aria-modal="true" aria-label="Omnibar Command Palette">
    <div class="omnibar-input-wrapper">
      <img class="omnibar-icon" src="icon.svg" alt="" style="width: 20px; height: 20px; margin-right: 10px; object-fit: contain;">
      <div class="omnibar-type-selector-wrapper" id="omnibar-type-selector-wrapper">
        <button type="button" class="omnibar-type-btn" id="omnibar-type-btn" aria-haspopup="listbox" aria-expanded="false" title="Select entry type" data-i18n-title="omnibar.typeSelectorTooltip">
          <span class="omnibar-type-btn-icon" id="omnibar-type-btn-icon">📥</span>
          <span class="omnibar-type-btn-label" id="omnibar-type-btn-label">Stash</span>
          <span class="omnibar-type-btn-arrow">▾</span>
        </button>
        <div class="omnibar-type-menu" id="omnibar-type-menu" role="listbox" style="display: none;"></div>
      </div>
      <div class="omnibar-input-area" id="omnibar-input-area">
        <div class="omnibar-ghost-layer" id="omnibar-ghost-layer" aria-hidden="true"></div>
        <input type="text" class="omnibar-input" id="omnibar-input" placeholder="Capture quick thought into stash..." data-i18n-placeholder="omnibar.placeholderStash" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="omnibar-results">
        <div class="omnibar-segmented-bar" id="omnibar-segmented-bar" style="display: none;"></div>
      </div>
      <span class="omnibar-esc-tip">⎋</span>
    </div>
    <div class="omnibar-param-indicator" id="omnibar-param-indicator"></div>
    <div class="omnibar-results-container" id="omnibar-results" role="region" aria-live="polite"></div>
    <div class="omnibar-footer" id="omnibar-footer">
      <div class="omnibar-footer-shortcuts">
        <span class="omnibar-footer-item"><kbd>↩</kbd> <span id="omnibar-lbl-select" data-i18n="omnibar.footerSelect">Select</span></span>
        <span class="omnibar-footer-item"><kbd>↑↓</kbd> <span id="omnibar-lbl-nav" data-i18n="omnibar.footerNavigate">Navigate</span></span>
        <span class="omnibar-footer-item"><kbd>⇥</kbd> <span id="omnibar-lbl-auto" data-i18n="omnibar.footerAutocomplete">Complete</span></span>
      </div>
      <button type="button" class="omnibar-footer-item omnibar-footer-close-btn" id="omnibar-footer-close-btn" onclick="OmnibarController.close()" title="Close command palette (Esc)" data-i18n-title="omnibar.closeTooltip">
        <kbd>⎋</kbd> <span id="omnibar-lbl-close" data-i18n="omnibar.footerClose">Close</span>
      </button>
    </div>
  </div>
</div>
